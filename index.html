<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>அB Portfolio</title>

  <!--
    ─── FAVICON CONFIGURATION ─────────────────────────────────────────
    Temporary: uses the existing nav logo as favicon source.
    To update: replace /favicon.svg, /favicon-32x32.png, /apple-touch-icon.png
    in the /public folder with final branded assets.
    ────────────────────────────────────────────────────────────────── -->

  <!-- Primary: SVG favicon — scales perfectly at all resolutions -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

  <!-- Fallback: PNG for older browsers that don't support SVG favicons -->
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon.svg" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon.svg" />

  <!-- Apple Touch Icon — used for iOS home screen / bookmarks -->
  <link rel="apple-touch-icon" href="/favicon.svg" />

  <!-- Web App Manifest color -->
  <meta name="theme-color" content="#ffffff" />

  <!-- Browser tab / pinned tab color (Safari) -->
  <meta name="msapplication-TileColor" content="#ffffff" />

  <!--
    ─── OPEN GRAPH / SOCIAL SHARING METADATA ──────────────────────────
    Deployed URL: https://abhishekrm-portfolio.vercel.app
    To update preview image: swap /og-image.png in the /public folder.
    ────────────────────────────────────────────────────────────────── -->

  <!-- Core OG -->
  <meta property="og:type"        content="website" />
  <meta property="og:site_name"   content="Abhishek R M — Portfolio" />
  <meta property="og:title"       content="Abhishek R M — Product Designer" />
  <meta property="og:description" content="Product Designer, Creator & Photographer based in India. Building thoughtful digital experiences with a focus on clarity, craft, and detail." />
  <meta property="og:url"         content="https://abhishekrm-portfolio.vercel.app" />
  <meta property="og:image"       content="https://abhishekrm-portfolio.vercel.app/og-image.png" />
  <meta property="og:image:width"  content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:type"   content="image/png" />
  <meta property="og:image:alt"    content="Abhishek R M — Product Designer, Creator & Photographer" />
  <meta property="og:locale"      content="en_IN" />

  <!-- Twitter / X Card -->
  <meta name="twitter:card"        content="summary_large_image" />
  <meta name="twitter:title"       content="Abhishek R M — Product Designer" />
  <meta name="twitter:description" content="Product Designer, Creator & Photographer based in India. Building thoughtful digital experiences with a focus on clarity, craft, and detail." />
  <meta name="twitter:image"       content="https://abhishekrm-portfolio.vercel.app/og-image.png" />
  <meta name="twitter:image:alt"   content="Abhishek R M — Product Designer, Creator & Photographer" />

  <!-- General search / indexing meta -->
  <meta name="description" content="Product Designer, Creator & Photographer based in India. Building thoughtful digital experiences with a focus on clarity, craft, and detail." />
  <meta name="author" content="Abhishek R M" />
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
